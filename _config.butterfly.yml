# ============================================================
# Butterfly 主题配置（5.6.1 键名结构）
# ============================================================
# 重要：本文件已按 5.x 结构重写。4.x 的键名（card_author 写在顶层、
# local_search / word_count / highlight_theme / top_img 等）在 5.x
# 全部无效，会被静默忽略。改配置前先对照
# node_modules/hexo-theme-butterfly/_config.yml 确认键名和层级。
# ============================================================

# --------------------------------------
# 导航
# --------------------------------------
nav:
  logo:
  display_title: true
  display_post_title: true
  fixed: false

menu:
  首页: / || fas fa-home
  时间轴: /archive/ || fas fa-archive
  分类: /categories/ || fas fa-folder-open
  标签: /tags/ || fas fa-tags
  关于: /about/ || fas fa-heart

# --------------------------------------
# 图标与顶部图
# --------------------------------------
favicon: /img/favicon.ico
avatar:
  img: /img/favicon.png
  effect: true

disable_top_img: false
default_top_img: /img/index-top-img.png
index_img: /img/index-top-img.png
archive_img: /img/cover-2.png
tag_img: /img/cover-3.png
category_img: /img/cover-1.png
index_top_img_height: 300px

# 文章封面（必须写在 cover 下，写顶层无效）
cover:
  index_enable: true
  aside_enable: true
  archives_enable: true
  default_cover:
    - /img/cover-1.png
    - /img/cover-2.png
    - /img/cover-3.png

# 主题自带 404 关闭，改用 source/404.md
error_404:
  enable: false

# --------------------------------------
# 首页
# --------------------------------------
subtitle:
  enable: true
  effect: true
  source: 1
  sub:
    - 从 CV 到大模型，一路的实操记录
    - 机器学习 / 深度学习 / LLM 微调
    - Linux 桌面与终端效率折腾
    - 本机跑通过的才写 🚀

# 首页文章布局：1 封面左 2 封面右 3 左右交替 4 封面在上 5 封面在下
index_layout: 1
# 摘要：1 全文 / 2 自动截取 / 3 按 more 标签截断
index_post_content:
  method: 2
  length: 150

# --------------------------------------
# 文章页
# --------------------------------------
toc:
  post: true
  page: true
  number: true
  expand: true
  style_simple: false
  scroll_percent: true

post_meta:
  page:
    date_type: both
    date_format: YYYY-MM-DD HH:mm:ss
  post:
    date_type: both
    date_format: YYYY-MM-DD HH:mm:ss

post_copyright:
  enable: true
  decode: false
  author_href: https://github.com/Fhj-id
  license: CC BY-NC-SA 4.0
  license_url: https://creativecommons.org/licenses/by-nc-sa/4.0/

reward:
  enable: false

# 代码高亮
code_blocks:
  theme: light
  copy: true
  language: true
  shrink: false
  fullpage: false
  macStyle: false
  height_limit: false
  word_wrap: false

# 字数与阅读时长（依赖 hexo-wordcount）
wordcount:
  enable: true
  post_wordcount: true
  min2read: true
  total_wordcount: true

# 不蒜子统计：境外服务国内加载不出来，全关
busuanzi:
  site_uv: false
  site_pv: false
  page_pv: false

# --------------------------------------
# 搜索
# --------------------------------------
search:
  use: local_search
  placeholder: 搜索文章…
  local_search:
    preload: false
    top_n_per_article: 1
    unescape: false

# --------------------------------------
# 页脚
# --------------------------------------
footer:
  owner:
    enable: true
    since: 2026
  custom_text: Powered by Hexo & Butterfly 🦋
  copyright: true

# --------------------------------------
# 侧边栏（卡片必须写在 aside 下）
# --------------------------------------
aside:
  enable: true
  position: right
  display:
    archive: true
    tag: true
    category: true
  card_author:
    enable: true
    description: 折腾 Linux 和自动化，写自己跑通过的东西
    button:
      enable: true
      icon: fab fa-github
      text: Follow Me
      link: https://github.com/Fhj-id   # 主题默认是 github.com/xxxxxx 死链
    # 邮箱已移除：真实邮箱会被搜索引擎抓取并可反查到本人，联系走 GitHub Issues
  card_announcement:
    enable: false
    content: 欢迎来到我的博客 🎉
  card_categories:
    enable: true
    limit: 8
  card_tags:
    enable: true
    limit: 40
  card_archives:
    enable: true
    type: monthly
    format: YYYY年MM月
    order: -1
    limit: 12
  card_recent_post:
    enable: true
    limit: 6
    sort: date
    sort_order: -1
  card_webinfo:
    enable: true
    post_count: true
    last_push_date: true

rightside_scroll_percent: true

# --------------------------------------
# 评论（giscus，基于 GitHub Discussions）
# --------------------------------------
# 启用步骤：
# 1. 仓库 Settings → Features 勾选 Discussions
# 2. 安装 https://github.com/apps/giscus （只授权这一个仓库）
# 3. 从 giscus.app 或 GitHub API 取 category_id 填到下面
# 4. 把 comments.use 改成 giscus
comments:
  use:
  text: true
  lazyload: false
  count: false

giscus:
  repo: Fhj-id/Fhj-id.github.io
  repo_id: R_kgDOUtkQNg        # 已通过 API 获取
  category_id:                 # 待填：开启 Discussions 后获取
  light_theme: light
  dark_theme: dark

# --------------------------------------
# 其他
# --------------------------------------
pwa:
  enable: false

lazyload:
  enable: false

inject:
  head:
    - <link rel="stylesheet" href="/css/custom.css">
  bottom:
    - <script>if(window.GLOBAL_CONFIG_SITE&&GLOBAL_CONFIG_SITE.pageType==='home'){document.documentElement.classList.add('hide-aside')}</script>

CDN:
  option: local
