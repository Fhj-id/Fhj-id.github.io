# Hexo 配置
## 文档: https://hexo.io/docs/configuration.html
## 来源: https://github.com/hexojs/hexo/

# 网站
title: Le的一亩三分地 
subtitle: '记录技术、学习与生活'
description: ''
keywords:
author: Le
language: zh-CN
timezone: 'Asia/Shanghai'

# URL
## 在这里设置你的网站网址。例如，如果你使用 GitHub Pages，请将网址设置为 'https://username.github.io/project'
url: https://Fhj-id.github.io
permalink: :year/:month/:day/:title/
permalink_defaults:
pretty_urls:
  trailing_index: true # 设置为 false 以从永久链接中移除结尾的 'index.html'
  trailing_html: true # 设置为 false 以从永久链接中移除末尾的 '.html'

# 目录
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# 写作
new_post_name: :title.md # 新帖文件名
default_layout: post
titlecase: false # 将标题转换为标题大小写
external_link:
  enable: true # 在新标签页中打开外部链接
  field: site # 应用于整个网站
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
future: true

# 替换了之前的 highlight.js 代码高亮方案，使用 prismjs 方案
syntax_highlighter: prismjs
highlight:
  enable: false
prismjs:
  enable: true
  preprocess: true
  line_number: true
  tab_replace: ''
# syntax_highlighter: highlight.js
# highlight:
#   line_number: true
#   auto_detect: false
#   tab_replace: ''
#   wrap: true
#   hljs: false
# prismjs:
#   preprocess: true
#   line_number: true
#   tab_replace: ''



# 首页设置
# path: 你的博客索引页的根路径。（默认 = ''）
# per_page: 每页显示的帖子数。（0 = 禁用分页）
# order_by: 帖子的排序方式。（默认按日期降序排列）
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# 分类与标签
default_category: uncategorized
category_map:
tag_map:

# 元数据元素
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# 日期 / 时间格式
## Hexo 使用 Moment.js 来解析和显示日期
## 你可以按照以下定义自定义日期格式
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option 支持 'mtime'、'date'、'empty'
updated_option: 'mtime'

# 分页
## 将 per_page 设置为 0 以禁用分页
per_page: 10
pagination_dir: page

# 包含 / 排除 文件
## include:/exclude: 选项仅适用于 'source/' 文件夹
include:
exclude:
ignore:

# 扩展
## 插件: https://hexo.io/plugins/
## 主题: https://hexo.io/themes/
theme: butterfly 

# 本地搜索
search:
  path: search.xml
  field: post
  content: true


# 部署
## 文档: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''

# 引用 Butterfly 主题配置文件
theme_config:
  # 如果你的 _config.butterfly.yml 在根目录，这里可以留空